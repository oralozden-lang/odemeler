<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3B44">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ödemeler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Yaklaşan ve geciken ödemeleri takip edin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Light theme only, by request. Layout: phone-first single column; a petrol "ledger" hero for the month, then due-date sections; bottom tab bar. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#14212A; --muted:#5D6B77; --line:#DCE3E8;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DDF0F1;
  --hero:#0B3B44; --hero-ink:#EAF6F7; --hero-muted:#9CC7CC; --hero-track:rgba(255,255,255,.14); --hero-fill:#5FD3C9;
  --tab-on:linear-gradient(135deg,#6EE7B7 0%,#22B07D 48%,#07704F 100%);
  --late:#C2410C; --late-soft:#FCE9DE; --ok:#15803D; --ok-soft:#DFF3E6; --warn:#B45309;
  --cat-l:42%; --cat-s:58%; --cat-bg-l:93%;
  --shadow:0 1px 2px rgba(20,33,42,.06),0 8px 24px rgba(20,33,42,.06);
  --font-display:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden;overflow-x:clip}  /* the swipe animation must never widen the page: Chrome would rescale it and the tab bar would jump */
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{touch-action:pan-y pinch-zoom;max-width:620px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 164px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px}
header.top h1{font-family:var(--font-display);font-size:26px;letter-spacing:-.01em;margin:0;line-height:1.1;text-wrap:balance}
header.top .date{color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px;display:grid;gap:14px}
.hero .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted)}
.hero .big{font-family:var(--font-display);font-size:32px;line-height:1.05;letter-spacing:-.01em}
.hero .sub{font-size:13px;color:var(--hero-muted)}
.bar{height:8px;border-radius:99px;background:var(--hero-track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hero-fill);border-radius:99px;transition:width .4s ease}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .split div{display:grid;gap:2px}
.hero .split b{font-size:16px;font-weight:700}
.alert{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--late-soft);color:var(--late);font-weight:600;font-size:14px;border:0;width:100%;text-align:left}
.alert svg{width:18px;height:18px;flex:none}
.alert span.grow{flex:1}

/* sections */
.section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 8px}
.sec-head h2{font-family:var(--font-display);font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.sec-head h2 .count{font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.sec-head .sum{font-size:13px;color:var(--muted);font-weight:600}
.sec-late h2{color:var(--late)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.empty-line{padding:16px;color:var(--muted);font-size:14px}

.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:0}
.item.late::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--late)}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px}
.check:hover{border-color:var(--accent)}
.item.paid .check{background:var(--ok);border-color:var(--ok);color:#fff}
.item .main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:grid;gap:3px}
.item .name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.item .meta .rel{font-weight:600}
.item.late .meta .rel{color:var(--late)}
.item .meta .soon{color:var(--warn)}
.item .amt{flex:none;font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.item .amt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.item.paid .name,.item.paid .amt{color:var(--muted)}
.item.paid .name{text-decoration:line-through;text-decoration-thickness:1px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;color:hsl(var(--h) var(--cat-s) var(--cat-l));background:hsl(var(--h) 60% var(--cat-bg-l))}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.note-ic{width:14px;height:14px;color:var(--muted)}

/* month view */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.month-nav h2{font-family:var(--font-display);font-size:22px;margin:0;text-align:center;flex:1}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.day-head{display:flex;justify-content:space-between;padding:0 4px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.day-head.today{color:var(--accent)}

/* items view */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;outline:0;height:100%;font-size:15px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:18px;font-family:var(--font-display);margin-top:2px}

/* bottom nav + fab */
/* floating dark petrol bar, the selected tab lit with a light-to-dark green gradient */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:596px;margin:0 auto;background:var(--hero);border-radius:24px;padding:7px;box-shadow:0 12px 30px rgba(11,59,68,.35);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;display:grid;justify-items:center;align-content:center;gap:3px;height:52px;padding:0;font-size:11.5px;font-weight:700;color:var(--hero-muted);border-radius:18px;transition:color .25s,background .25s,box-shadow .25s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:#fff;background:var(--tab-on);box-shadow:0 6px 16px rgba(8,127,91,.45);font-weight:800;text-shadow:0 1px 1px rgba(0,0,0,.18)}
nav.tabs button:focus-visible{outline-color:var(--hero-fill)}
.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(env(safe-area-inset-bottom) + 92px);width:56px;height:56px;border-radius:18px;border:0;background:var(--tab-on);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(8,127,91,.4);z-index:21}
.fab svg{width:26px;height:26px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(6,14,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .2s ease}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--font-display);font-size:21px;margin:0 0 4px;text-wrap:balance}
.sheet .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.notebox{white-space:pre-wrap;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px;overflow-wrap:anywhere}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:16px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mchips button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 0;font-size:13px;font-weight:700;color:var(--muted)}
.mchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btns{display:grid;gap:8px;margin-top:6px}
.btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{background:transparent;color:var(--late);border-color:var(--late-soft)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55}
.err{color:var(--late);font-size:13px;font-weight:600;min-height:1em;margin:0 0 6px}
.paidbox{display:flex;align-items:center;gap:10px;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:10px}
.paidbox svg{width:18px;height:18px}

/* toast + states */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 160px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:up .2s ease}
.toast button{border:0;background:transparent;color:var(--hero-fill);font-weight:800;padding:6px 8px}
.state{text-align:center;padding:48px 20px;color:var(--muted)}
.state h2{font-family:var(--font-display);color:var(--ink);margin:0 0 6px;font-size:20px}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;margin-top:10px;border:1px solid var(--line)}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
.group-h{font-family:var(--font-display);font-size:15px;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.group-h span{font-family:var(--font-body);font-size:12px;font-weight:700}
.icards{display:grid;gap:10px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 6px}
.icard header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.icard h3{font-family:var(--font-display);font-size:17px;margin:0;text-wrap:balance}
.icard .ed{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.icard dl{margin:0}
.frow{display:grid;grid-template-columns:minmax(96px,40%) 1fr;gap:10px;align-items:center;border-top:1px solid var(--line);padding:7px 0}
.frow:first-child{border-top:0}
.frow dt{font-size:12.5px;color:var(--muted);font-weight:600}
.frow dd{margin:0;min-width:0}
.copy{width:100%;text-align:right;border:0;background:transparent;padding:4px 0;font-weight:600;font-size:14px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;border-radius:6px}
.copy:active{background:var(--accent-soft)}
.icard .inote{font-size:13px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);padding:8px 0 6px;overflow-wrap:anywhere}
.frow-ed{display:grid;grid-template-columns:1fr 1.3fr 40px;gap:6px;margin-bottom:6px}
.frow-ed input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;font-size:15px;outline:0;min-width:0}
.frow-ed input:focus{border-color:var(--accent);background:var(--surface)}
.frow-ed button{border:1px solid var(--line);background:transparent;border-radius:10px;color:var(--late);font-size:20px;line-height:1}
.est{color:var(--muted);font-weight:600}
.hero-note{border:0;background:rgba(255,255,255,.08);color:var(--hero-muted);border-radius:12px;padding:9px 12px;font-size:13px;text-align:left}
.hero-note b{color:var(--hero-fill)}
.btn.wide{width:100%;margin-top:12px}
.item.renew .amt small{color:var(--accent);font-weight:700}
.amt-row{display:grid;grid-template-columns:1fr 132px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.amt-row:first-child{border-top:0}
.amt-row label{display:grid;gap:2px;min-width:0}
.amt-row label b{font-size:14.5px;overflow-wrap:anywhere}
.amt-row label span{font-size:12px;color:var(--muted)}
.amt-row input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;font-size:16px;text-align:right;outline:0;font-variant-numeric:tabular-nums}
.amt-row input:focus{border-color:var(--accent);background:var(--surface)}
.cat-row{display:grid;grid-template-columns:36px 1fr 104px 36px;gap:6px;align-items:center;margin-bottom:8px}
.cat-row input,.cat-row select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px;font-size:15px;outline:0;min-width:0}
.cat-row .hue{width:36px;height:36px;border-radius:10px;border:0;background:hsl(var(--h) var(--cat-s) var(--cat-l))}
.cat-row .x{height:36px;border:1px solid var(--line);background:transparent;border-radius:10px;color:var(--late);font-size:20px}
.cat-move{grid-column:1/-1;display:grid;gap:6px;background:var(--late-soft);color:var(--late);border-radius:10px;padding:10px;font-size:13px;font-weight:600}
.cat-move .btn{padding:9px}
.fbar{position:relative;display:flex;gap:6px;margin:0 0 14px}
.search + .fbar{margin-top:10px}
.fbtn{flex:1;display:flex;align-items:center;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;height:46px;padding:0 12px;text-align:left}
.fbtn .fl{font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.fbtn .fv{flex:1;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn svg{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .15s}
.fbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.fbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.fbtn.on .fv{color:var(--accent)}
.fclear{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:22px;color:var(--muted)}
.fpanel{position:absolute;left:0;right:0;top:52px;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(20,33,42,.18);padding:6px;max-height:60vh;overflow:auto}
.fopt{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;font-weight:600;font-size:15px}
.fopt:active{background:var(--surface-2)}
.fopt input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.fopt .dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) var(--cat-s) var(--cat-l));flex:none}
.fopt .grow{flex:1}
.fopt .cnt{font-size:12.5px;color:var(--muted);font-weight:700}
.factions{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:4px;padding:8px 4px 4px;flex-wrap:wrap}
.factions button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.factions .done{margin-left:auto;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.alert.soft{background:#FFF6E5;color:#7A4B07}
.alert.soft b{color:var(--accent)}
.banner.nag{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:#FFF6E5;border-color:#F3D9A4;color:#7A4B07}
.banner.nag b{flex:none;color:var(--accent);font-size:13.5px}
@keyframes fade{from{opacity:0}}
/* tab change by swipe: the new tab slides in from the side it came from */
#view.from-r{animation:fromR .22s ease}
#view.from-l{animation:fromL .22s ease}
@keyframes fromR{from{transform:translateX(28px);opacity:.3}}
@keyframes fromL{from{transform:translateX(-28px);opacity:.3}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero .big{font-size:27px}.item .amt{font-size:14px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <h1 id="title">Yaklaşan ödemeler</h1>
      <div class="date" id="today"></div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Yedek">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>
  <main id="view">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>
</div>

<button class="fab" id="fab" aria-label="Yeni ödeme ekle">
