function setTab(tab){
  if(tab !== "bilgiler") lockVault();
  S.tab = tab; if(tab==="ay" && !S.cursor) S.cursor = curPeriod();
  if(location.hash !== "#"+tab) history.replaceState(null, "", "#"+tab);
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(["ajanda","ay","kalemler","bilgiler"].includes(h) && h!==S.tab){ S.tab=h; render(); } });

/* ---------- swipe between tabs ---------- */
// Left swipe: next tab, right swipe: previous one (no wrap-around). Only a clearly sideways, quick, long-enough
// swipe counts, so scrolling a list never changes tabs. Swipes starting at the screen edges are left alone:
// there Android's gesture navigation means "back", which would close the app.
const TAB_ORDER = ["ajanda","ay","kalemler","bilgiler"];
const SWIPE = {edge: 28, min: 60, ratio: 1.5, maxMs: 900};
let swipeStart = null;
// listened for on the whole page area (#app), so empty space below a short list also takes the swipe
const swipeArea = $("#app");
swipeArea.addEventListener("touchstart", e => {
  swipeStart = null;
  if(e.touches.length !== 1 || $(".overlay")) return;
  if(e.target.closest("input, textarea, select, .fpanel")) return;
  const t = e.touches[0];
  if(t.clientX < SWIPE.edge || t.clientX > window.innerWidth - SWIPE.edge) return;
  swipeStart = {x: t.clientX, y: t.clientY, at: Date.now()};
}, {passive: true});
swipeArea.addEventListener("touchmove", e => { if(e.touches.length !== 1) swipeStart = null; }, {passive: true});
swipeArea.addEventListener("touchcancel", () => { swipeStart = null; }, {passive: true});
swipeArea.addEventListener("touchend", e => {
  const s = swipeStart; swipeStart = null;
  if(!s || $(".overlay")) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - s.x, dy = t.clientY - s.y;
  if(Date.now() - s.at > SWIPE.maxMs || Math.abs(dx) < SWIPE.min || Math.abs(dx) < SWIPE.ratio * Math.abs(dy)) return;
  const sel = window.getSelection && String(window.getSelection()); if(sel) return;  // selecting text, not swiping
  const next = TAB_ORDER[TAB_ORDER.indexOf(S.tab) + (dx < 0 ? 1 : -1)];
  if(!next) return;
  if(S.filterOpen) S.filterOpen = false;
  setTab(next);
  const v = $("#view");
  v.classList.remove("from-r", "from-l"); void v.offsetWidth;  // restart the animation
  v.classList.add(dx < 0 ? "from-r" : "from-l");
}, {passive: true});
$("#view").addEventListener("animationend", e => { if(e.target.id === "view") e.target.classList.remove("from-r", "from-l"); });

/* ---------- sheets ---------- */
// Each open sheet sits on its own history entry, so Android's back button closes the sheet instead of the app.
let sheetEntry = false;
function removeSheet(){ const o = $(".overlay"); if(o) o.remove(); document.body.style.overflow = ""; }
function openSheet(html, onMount){
  removeSheet();
  if(!sheetEntry){ history.pushState({sheet:1}, "", location.href); sheetEntry = true; }
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  ov.addEventListener("click", e => { if(e.target === ov) closeSheet(); });
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  onMount && onMount(ov.querySelector(".sheet"));
  const f = ov.querySelector("[autofocus]"); if(f) setTimeout(()=>f.focus(), 60);
}
function closeSheet(){ removeSheet(); if(sheetEntry){ sheetEntry = false; history.back(); } }
window.addEventListener("popstate", () => {
  if(sheetEntry){ sheetEntry = false; removeSheet(); }
  // a tab picked while the sheet was open must survive stepping back over the sheet's entry
  if(location.hash !== "#" + S.tab) history.replaceState(null, "", "#" + S.tab);
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

      const row = (l, shown, copy) => `<div class="brow"><div class="bv"><span>${l}</span><b>${esc(shown)}</b></div>${actBtns(copy, share)}</div>`;
      return `<div class="paybox"><div class="pbh">Havale bilgileri</div>${it.payee ? row("Hesap sahibi", it.payee, it.payee) : ""}${it.iban ? row("IBAN", fmtIban(it.iban), normIban(it.iban)) : ""}</div>`;

      </div>` : `
      <div class="two">
        <div class="field"><label for="pAmt">${k === "variable" ? "Bu ayın tutarı (₺)" : "Ödenen tutar (₺)"}</label><input id="pAmt" data-money inputmode="decimal" placeholder="${k === "variable" && prevAmt != null ? "Geçen ay " + esc(tl(prevAmt)) : "Örn. 92.500,00"}" value="${esc(amountInput(k === "variable" ? entered : o.amt))}" ${focusAmount?"autofocus":""}></div>
        <div class="field"><label for="pAt">Ödeme tarihi</label><input id="pAt" type="date" value="${iso(todayDate())}"></div>
      </div>

      (b.dataset.act === "copy" ? copyValue : shareValue)(b.dataset.v);
    });

    if(cp) cp.onclick = async () => {
      const txt = plainAmount(o.amt);

function openAmounts(period){
  const [y,m] = period.split("-").map(Number);
  const list = filtered(occurrences(period)).filter(o => !o.paid && kindOf(o.it) === "variable");
  if(!list.length){ toast("Bu ay girilecek değişken tutar yok"); return; }
  const html = `
    <h3>${ML[m-1]} ${y} tutarları</h3>
    <p class="lead">Ekstre veya tahakkuk gelen kalemlerin tutarını yazın. Boş bıraktıklarınız "Tutar girilmedi" olarak kalır ve toplamlara girmez.</p>
    <div id="amtList">${list.map(o => {
      const e = enteredAmount(o.it, period);
      const prevAmt = lastKnown(o.it, period);
      return `<div class="amt-row"><label for="a_${esc(o.it.id)}"><b>${esc(o.it.name)}</b><span>${esc(fd(fmtDay, o.date))} · ${esc(catOf(o.it).label)}${prevAmt != null ? " · geçen ay " + esc(tl(prevAmt)) : ""}</span></label>
        <input id="a_${esc(o.it.id)}" data-id="${esc(o.it.id)}" data-money inputmode="decimal" placeholder="Tutar" value="${esc(amountInput(e))}"></div>`;
    }).join("")}</div>
    <p class="err" id="aErr"></p>
    <div class="btns">
      <button class="btn primary" type="button" id="aSave">Tutarları kaydet</button>
      <button class="btn ghost" type="button" id="aCancel">Vazgeç</button>
    </div>`;
  openSheet(html, sh => {
    sh.querySelector("#aCancel").onclick = closeSheet;
    sh.querySelector("#aSave").onclick = () => {
      const map = {}; let bad = null, n = 0;
      sh.querySelectorAll("#amtList input").forEach(inp => {
        const raw = inp.value.trim();
        const v = raw === "" ? null : parseAmount(raw);
        if(Number.isNaN(v)){ bad = bad || inp; return; }
        map[inp.dataset.id] = v; if(v != null) n++;
      });
      if(bad){ sh.querySelector("#aErr").textContent = "Bir tutar rakam değil, kontrol edin."; bad.focus(); return; }
      if(!setAmounts(period, map)) { sh.querySelector("#aErr").textContent = dbErr(); return; }
      closeSheet(); render(); toast(`${n} tutar kaydedildi`);
    };
  });
}

        saveBtn.dataset.ibanOk = iban;
        err.textContent = "IBAN hatalı görünüyor (TR ile başlayan 26 karakter olmalı). Kontrol edin; yine de kaydetmek için tekrar dokunun.";
        sh.querySelector("#fIban").focus();
        return;
      }
      if(payee) data.payee = payee; else delete data.payee;
      if(iban) data.iban = iban; else delete data.iban;
      if(mode === "once"){
        const d = sh.querySelector("#fOnce").value;
        if(!d){ err.textContent = "Ödeme tarihini seçin."; return; }
        Object.assign(data, {once: d, day: Number(d.slice(8)), months: [], start: d.slice(0,7), kind: "fixed", amount, prices: amount != null ? [{from: d.slice(0,7), amount}] : []});
        delete data.end; delete data.renewMonth;
      } else {
        const day = Number(sh.querySelector("#fDay").value);
        if(!Number.isInteger(day) || day < 1 || day > 31){ err.textContent = "Ayın gününü 1 ile 31 arasında yazın."; return; }
        if(mode === "months" && !months.length){ err.textContent = "En az bir ay seçin."; return; }
        // An item saved without a start month (old backups) keeps having none; inventing one would hide its past.
        const start = sh.querySelector("#fStart").value || (it && !it.once ? null : cp);
        const end = sh.querySelector("#fEnd").value || null;
        if(end && start && end < start){ err.textContent = "Son ay, başlangıç ayından önce olamaz."; return; }
        const kind = kindSel.value;
        Object.assign(data, {once: null, day, months: mode === "months" ? months : ALL, kind});
        if(start) data.start = start; else delete data.start;
        if(end) data.end = end; else delete data.end;
        if(kind === "fixed"){
          const rm = Number(sh.querySelector("#fRenew").value) || null;
          if(rm) data.renewMonth = rm; else delete data.renewMonth;
          let prices = Array.isArray(data.prices) ? [...data.prices] : [];
          if(!it || it.once){
            prices = amount != null ? [{from: start || cp, amount}] : [];
          } else if(kindOf(it) !== "fixed" || amount !== curAmount){
            // was variable, or the amount changed: the new figure holds from the chosen month on
            const from = sh.querySelector("#fFrom").value || cp;
            prices = (prices.length || amount != null) ? setPriceFrom(prices, from, amount) : [];
          }
          data.prices = prices; data.amount = amount;
        } else {
          // price history is kept (unused while variable) so switching back to fixed does not lose it
          delete data.amount; delete data.renewMonth;
        }
      }
      const btn = sh.querySelector("#save"); btn.disabled = true;
      try { await saveItem(id, data); closeSheet(); toast(it ? "Kaydedildi" : `${name} eklendi`); }
      catch(e2){ err.textContent = dbErr(); btn.disabled = false; }
    };
  });
}

function openCats(){
  let rows = S.cats.map(c => ({...c}));
  const moves = {};  // deleted category id -> target id
  const countOf = id => S.items.filter(i => (i.cat||"") === id && !(id in moves)).length;
  const draw = sh => {
    sh.querySelector("#catList").innerHTML = rows.map((c, i) => `
      <div class="cat-row" data-i="${i}">
        <button type="button" class="hue" data-act2="hue" style="--h:${Number(c.h)||0}" aria-label="Rengi değiştir"></button>
        <input data-f="label" value="${esc(c.label)}" aria-label="Kategori adı" placeholder="Kategori adı">
        <select data-f="kind" aria-label="Varsayılan tutar türü"><option value="fixed" ${c.kind==="fixed"?"selected":""}>Sabit</option><option value="variable" ${c.kind==="variable"?"selected":""}>Değişken</option></select>
        <button type="button" class="x" data-act2="del" aria-label="Kategoriyi sil">×</button>
        ${c._deleting ? `<div class="cat-move">${countOf(c.id)} kalem bu kategoride. Şuraya taşı:
          <select data-f="target">${rows.filter(x => x.id !== c.id && !x._deleting).map(x => `<option value="${esc(x.id)}">${esc(x.label)}</option>`).join("")}</select>
          <button type="button" class="btn danger" data-act2="confirm">Taşı ve sil</button></div>` : ""}
      </div>`).join("");
  };
  const html = `
    <h3>Kategoriler</h3>
    <p class="lead">Rengine dokunarak değiştirin. Sabit/Değişken, o kategoride yeni eklenen kalemlerin varsayılan tutar türüdür.</p>
    <div id="catList"></div>
    <button class="btn ghost" type="button" id="cAdd" style="padding:10px;width:100%">+ Kategori ekle</button>
    <p class="err" id="cErr"></p>
    <div class="btns">
      <button class="btn primary" type="button" id="cSave">Kaydet</button>
      <button class="btn ghost" type="button" id="cCancel">Vazgeç</button>
    </div>`;
  openSheet(html, sh => {
    draw(sh);
    const list = sh.querySelector("#catList");
    const syncInputs = () => list.querySelectorAll(".cat-row").forEach(r => {
      const c = rows[Number(r.dataset.i)];
      c.label = r.querySelector('[data-f="label"]').value;
      c.kind = r.querySelector('[data-f="kind"]').value;
    });
    list.onclick = e => {
      const b = e.target.closest("[data-act2]"); if(!b) return;
      syncInputs();
      const i = Number(b.closest(".cat-row").dataset.i), c = rows[i];
      if(b.dataset.act2 === "hue"){ c.h = HUES[(HUES.indexOf(c.h) + 1) % HUES.length]; }
      else if(b.dataset.act2 === "del"){
        if(rows.filter(x => !x._deleting).length <= 1){ sh.querySelector("#cErr").textContent = "En az bir kategori kalmalı."; return; }
        if(countOf(c.id) === 0){ rows.splice(i, 1); }
        else c._deleting = !c._deleting;
      }
      else if(b.dataset.act2 === "confirm"){
        moves[c.id] = b.parentElement.querySelector('[data-f="target"]').value;
        rows.splice(i, 1);
      }
      draw(sh);
    };
    sh.querySelector("#cAdd").onclick = () => {
      syncInputs();
      const used = new Set(rows.map(r => r.h));
      rows.push({id: "c" + Date.now().toString(36), label: "", h: HUES.find(h => !used.has(h)) ?? 210, kind: "variable"});
      draw(sh); const ins = list.querySelectorAll('[data-f="label"]'); ins[ins.length-1].focus();
    };
    sh.querySelector("#cCancel").onclick = closeSheet;
    sh.querySelector("#cSave").onclick = () => {
      syncInputs();
      if(rows.some(r => r._deleting)){ sh.querySelector("#cErr").textContent = "Silmek istediğiniz kategorinin kalemlerini nereye taşıyacağınızı seçip \"Taşı ve sil\"e dokunun."; return; }
      if(rows.some(r => !r.label.trim())){ sh.querySelector("#cErr").textContent = "Her kategoriye bir ad verin."; return; }
      const resolve = id => { let t = id, n = 0; while(t in moves && n++ < 20) t = moves[t]; return t; };
      S.cats = rows.map(({_deleting, ...c}) => ({...c, label: c.label.trim()}));
      S.items = S.items.map(i => (i.cat in moves) ? {...i, cat: resolve(i.cat)} : i);
      S.catSel = S.catSel.filter(id => id === "" || S.cats.some(c => c.id === id)); saveCatSel();
      if(!persist()){ sh.querySelector("#cErr").textContent = dbErr(); return; }
      closeSheet(); render(); toast("Kategoriler kaydedildi");
    };
  });
}

function backupData(){
  return {app:"odeme-takvimi", version:1, schema:SCHEMA, exported:new Date().toISOString(), items:S.items, months:S.months, cats:S.cats, infos:S.infos, sube:S.sube, vault:S.vault};
}
function markBackedUp(){ if(S.failed) return; S.lastBackup = new Date().toISOString(); persist(); render(); }
// While saved data cannot be read, "backup" hands out that unreadable text untouched, so it can still be rescued.
const backupText = pretty => S.failed ? (S.badRaw || "") : JSON.stringify(backupData(), null, pretty ? 1 : 0);
// Android's share sheet refuses .json files, so shared backups go out as plain text (.txt); restore accepts both.
function backupFile(ext = "json"){
  const name = `odemeler-yedek-${iso(todayDate())}.${ext}`;
  const name2 = S.failed ? name.replace("yedek", "okunamayan-veri") : name;
  return new File([backupText(true)], name2, {type: ext === "txt" ? "text/plain" : "application/json"});
}

function openMenu(){
  const lb = S.lastBackup ? new Date(S.lastBackup) : null;
  const last = lb && !isNaN(lb) ? fmtLong.format(lb) : "hiç alınmadı";
  const canShare = !!(navigator.canShare && navigator.canShare({files:[backupFile("txt")]}));
  const html = `
    <h3>Yedek</h3>
    ${S.failed ? `<p class="lead"><b>Kayıtlı veriler okunamadı.</b> Aşağıdaki düğmeler okunamayan ham veriyi olduğu gibi verir; geri yüklemeden önce saklayın ki gerekirse kurtarılabilsin.</p>` :
    `<p class="lead">Ödemeleriniz ve şube bilgileriniz yalnızca bu telefonda saklanıyor. Telefon değişirse ya da uygulama silinirse yedek dosyasıyla geri getirirsiniz. Son yedek: <b>${esc(last)}</b>.</p>`}
    <div class="btns">
      ${canShare ? `<button class="btn primary" type="button" id="share">${S.failed ? "Ham veriyi" : "Yedeği"} OneDrive'a / Drive'a gönder</button>` : ""}
      <button class="btn ${canShare?"":"primary"}" type="button" id="dl">${S.failed ? "Ham veriyi indir" : "Yedek dosyasını indir"}</button>
      <button class="btn ghost" type="button" id="copy">${S.failed ? "Ham veriyi" : "Yedeği"} panoya kopyala</button>
    </div>
    <div class="btns" style="margin-top:14px"><button class="btn" type="button" id="toCats">Kategorileri düzenle</button></div>
    <div class="field" style="margin-top:18px"><label for="impFile">Yedekten geri yükle</label><input id="impFile" type="file" accept=".json,.txt,application/json,text/plain"></div>
    <div class="field"><label for="impTxt">veya yedek metnini yapıştırın</label>
      <textarea id="impTxt" placeholder="Eski uygulamadaki ⋯ > Yedeği panoya kopyala ile aldığınız metin"></textarea></div>
    <p class="err" id="mErr"></p>
    <div class="btns">
      <button class="btn" type="button" id="imp">Yedeği yükle</button>
      <button class="btn ghost" type="button" id="close">Kapat</button>
    </div>
    <p class="lead" style="text-align:center;margin:14px 0 0;font-size:12px">Sürüm ${APP_VERSION}</p>`;
  openSheet(html, sh => {
    const msg = sh.querySelector("#mErr");
    sh.querySelector("#close").onclick = closeSheet;
    sh.querySelector("#toCats").onclick = openCats;
    const share = sh.querySelector("#share");
    if(share) share.onclick = async () => {
      try { await navigator.share({files:[backupFile("txt")]}); markBackedUp(); closeSheet(); toast("Yedek gönderildi"); }
      catch(e){
        if(e && e.name === "AbortError") return;  // closed the share sheet
        msg.textContent = `Paylaşılamadı (${e && e.name || "hata"}). "Yedek dosyasını indir" ile kaydedip dosyayı OneDrive uygulamasından yükleyin.`;
      }
    };
    sh.querySelector("#dl").onclick = () => {
      const f = backupFile(); const url = URL.createObjectURL(f);
      const a = document.createElement("a"); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      markBackedUp(); closeSheet(); toast("Yedek İndirilenler klasörüne kaydedildi");
    };
    sh.querySelector("#copy").onclick = async () => {
      const data = backupText(false);
      try { await navigator.clipboard.writeText(data); markBackedUp(); closeSheet(); toast("Yedek panoya kopyalandı"); }
      catch(e){ sh.querySelector("#impTxt").value = data; msg.style.color = "var(--muted)"; msg.textContent = "Pano kullanılamadı. Yedek aşağıdaki kutuya yazıldı, oradan kopyalayın."; }
    };
    const imp = sh.querySelector("#imp");
    const IMP_LABEL = imp.textContent;
    // A confirmation only counts for the backup it was asked about: changing the file or text asks again.
    const resetConfirm = () => { delete imp.dataset.confirm; imp.textContent = IMP_LABEL; msg.textContent = ""; };
    sh.querySelector("#impTxt").addEventListener("input", resetConfirm);
    sh.querySelector("#impFile").onchange = async e => {
      const f = e.target.files[0]; if(!f) return;
      resetConfirm(); imp.disabled = true; imp.textContent = "Dosya okunuyor…";
      try { sh.querySelector("#impTxt").value = (await f.text()).replace(/^\uFEFF/, ""); }
      catch(err){ msg.textContent = "Dosya okunamadı. Tekrar seçin ya da metni yapıştırın."; }
      imp.disabled = false; imp.textContent = IMP_LABEL;
    };
    imp.onclick = () => {
      msg.style.color = "";
      let data;
      try { data = JSON.parse(sh.querySelector("#impTxt").value.replace(/^\uFEFF/, "")); } catch(e){ msg.textContent = "Bu metin geçerli bir yedek değil. Dosyayı seçin ya da metnin tamamını yapıştırın."; return; }
      if(data && !Array.isArray(data.items) && (isObj(data.sube) || Array.isArray(data.infos))){
        if(S.failed){ msg.textContent = "Kayıtlı veriler okunamadığı için önce tam yedeği (ödemeler dahil) yükleyin."; return; }
        if(!isObj(data.sube)){ msg.textContent = "Bu dosya eski biçimdeki bilgi kartlarını içeriyor; yeni Bilgiler sekmesi bunları kullanmıyor."; return; }
        const sube = cleanSube(data.sube);
        if(!Array.isArray(data.sube.general)) sube.general = S.sube.general;  // a branch-only file keeps the Genel cards
        if(S.sube.branches.length && imp.dataset.confirm !== "1"){
          imp.dataset.confirm = "1";
          imp.textContent = `Mevcut ${S.sube.branches.length} şubenin yerine ${sube.branches.length} şube yüklensin mi? Ödemeleriniz değişmez. Onaylamak için tekrar dokunun`;
          return;
        }
        const prevS = S.sube; S.sube = sube;
        if(!persist()){ S.sube = prevS; msg.textContent = dbErr(); return; }
        closeSheet(); setTab("bilgiler"); toast(`${sube.branches.length} şube yüklendi`);
        return;
      }
      if(!data || !Array.isArray(data.items)){ msg.textContent = "Yedekte ödeme kalemi bulunamadı."; return; }
      const items = data.items.filter(i => i && i.id && i.name);
      const replacesSube = isObj(data.sube) && S.sube.branches.length;
      if((S.items.length || replacesSube) && imp.dataset.confirm !== "1"){
        imp.dataset.confirm = "1";
        const parts = [];
        if(S.items.length) parts.push(`mevcut ${S.items.length} kalemin yerine ${items.length} kalem`);
        if(replacesSube) parts.push(`${S.sube.branches.length} şubenin yerine ${cleanSube(data.sube).branches.length} şube`);
        imp.textContent = `${parts.join(" ve ")} yüklensin mi? Onaylamak için tekrar dokunun`.replace(/^./, c => c.toLocaleUpperCase("tr"));
        return;
      }
      let mig;
      try { mig = migrate({...data, items}); } catch(e){ msg.textContent = "Bu yedek okunamadı."; return; }
      const months = mig.months;
      const prev = {items:S.items, months:S.months, cats:S.cats};
      const prevInfos = S.infos, prevSube = S.sube, prevFailed = S.failed;
      S.items = mig.items; S.months = months; S.cats = mig.cats; S.failed = null;
      if(Array.isArray(data.infos)) S.infos = cleanInfos(data.infos);
      if(isObj(data.sube)){  // a backup from before branches existed leaves them as they are
        const sube = cleanSube(data.sube);
        if(!Array.isArray(data.sube.general)) sube.general = S.sube.general;
        S.sube = sube;
      }
      const prevVault = S.vault;
      if(isObj(data.vault)){ S.vault = cleanVault(data.vault); lockVault(); }  // cards open with the PIN they were saved under
      if(!persist()){ S.items = prev.items; S.months = prev.months; S.cats = prev.cats; S.infos = prevInfos; S.sube = prevSube; S.vault = prevVault; S.failed = prevFailed; msg.textContent = dbErr(); return; }
      S.badRaw = null;
      closeSheet(); render(); toast(`${mig.items.length} kalem yedekten yüklendi`);
    };
  });
}

/* ---------- boot ---------- */
function boot(){
  $("#today").textContent = fmtHead.format(todayDate());
  const h = location.hash.slice(1);
  if(["ajanda","ay","kalemler","bilgiler"].includes(h)) S.tab = h;
  load();
  if(!S.sube) S.sube = emptySube();
  render();
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if("serviceWorker" in navigator && location.protocol === "https:"){
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(reg => {
      // an app brought back from the background never reloads on its own, so look for a new version then
      document.addEventListener("visibilitychange", () => { if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch(()=>{});
    // a new version took over: offer to reload (not on first install, when there was no older version)
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if(!hadController || boot.updateShown) return;
      boot.updateShown = true;
      const show = () => toast("Uygulamanın yeni sürümü hazır.", "Yenile", () => location.reload());
      if($(".overlay")) setTimeout(show, 8000); else show();
    });
  }
}
// keep "today" right on an app left open overnight
function tick(){
  const n = iso(todayDate());
  if(n === tick.d) return;
  // a new month: the Aylık tab follows along if it was showing the month that just ended
  if(n.slice(0,7) !== tick.d.slice(0,7) && S.cursor === tick.d.slice(0,7)) S.cursor = n.slice(0,7);
  tick.d = n; $("#today").textContent = fmtHead.format(todayDate()); render();
}
tick.d = iso(todayDate());
setInterval(tick, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(); });
window.addEventListener("storage", e => { if(e.key === KEY){ load(); if(!S.sube) S.sube = emptySube(); render(); } });
boot();
})();
</script>
